# =====================================================================
# 开发环境覆盖配置：执行 docker compose up（默认）时自动合并
# 生产部署请使用：docker compose -f docker-compose.yml up -d --build
# 开发时镜像/容器名将 prod 替换为 dev，端口仍为 20001:8080
# =====================================================================
services:
  bedrock.webapi:
    image: bee-budget-backend-dev:latest
    container_name: bee-budget-backend-dev
    environment:
      # 开发环境：启用 OpenAPI / Scalar 调试页面
      ASPNETCORE_ENVIRONMENT: Development
